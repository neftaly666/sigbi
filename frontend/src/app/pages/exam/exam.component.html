<router-outlet></router-outlet>

@if (!hasChildActive()) {
  <mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
</mat-form-field>

<div class="mat-shadow-2">
  <table mat-table [dataSource]="dataSource" matSort>
    
    <ng-container matColumnDef="idExam">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.idExam}} </td>
    </ng-container>
    
    <ng-container matColumnDef="nameExam">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> NAME </th>
      <td mat-cell *matCellDef="let row"> {{row.nameExam}} </td>
    </ng-container>
    
    <ng-container matColumnDef="descriptionExam">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> DESCRIPTION </th>
      <td mat-cell *matCellDef="let row"> {{row.descriptionExam}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ACTIONS </th>
      <td mat-cell *matCellDef="let row"> 
        <button mat-flat-button [routerLink]="['edit', row.idExam]">
        <!--<button mat-flat-button routerLink="/pages/exam/edit/{{row.idExam}}">-->
           <span>Edit</span>
           <mat-icon>edit</mat-icon>
        </button>  

        <button mat-flat-button class="cancel-button" (click)="delete(row.idExam)">
           <span>Delete</span>
           <mat-icon>delete</mat-icon>
        </button>  
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[3, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>

  <button mat-fab style="float: right;" routerLink="/pages/exam/new">
    <mat-icon>add</mat-icon>
  </button>
</div>
}
