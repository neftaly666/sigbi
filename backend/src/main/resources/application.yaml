server:
  #Render, Railway y Fly inyectan PORT; en local manda SERVER_PORT y si no, el 8080
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  application:
    name: sigbi-backend
  messages:
    #Los messages*.properties llevan tildes y eñes. Spring Boot ya usa UTF-8 por defecto,
    #pero se declara para que no dependa de la plataforma donde se arranque.
    encoding: UTF-8
  security:
    oauth2:
      resourceserver:
        jwt:
          #Spring descarga las claves publicas y valida firma, emisor y expiracion.
          #Tiene que apuntar al mismo proyecto que app.supabase.url o todo sera 401 tras un login correcto          
          issuer-uri: ${SUPABASE_ISSUER_URI}
  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: org.postgresql.Driver    
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    #Lo único que SIGBI usa de Spring AI: el modelo de chat del asistente (RF-14).
    #La memoria de la conversación es del proceso, no de una tabla, así que no hay
    #repositorio JDBC que configurar. Si RF-19 (RAG) llegara a entrar, aquí volverian
    #el almacen de vectores pgvector y su dependencia.
    openai:
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
app:
  auth:
    #PA-02: la seguridad es opcional según el enunciado. false abre /v1/** sin token.
    enabled: ${AUTH_ENABLED:true}
    #cookie | bearer. Tiene que decir lo mismo que environment.AUTH_MODE del frontend
    mode: ${AUTH_MODE:bearer}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}          # true en produccion (HTTPS)
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}      # None si el frontend vive en otro dominio (exige secure: true)
  front:    
    url: ${FRONT_URL}
  supabase:    
    url: ${SUPABASE_URL}    
    anon-key: ${SUPABASE_ANON_KEY}    
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    bucket: ${SUPABASE_BUCKET:photos}
    max-photo-size: ${SUPABASE_MAX_PHOTO_SIZE:2097152}
    